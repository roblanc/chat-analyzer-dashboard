[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/knowledge.md", "netlify/data/chat.txt", "netlify/data/chat.index.json"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
